name: 功能建议
description: 提议新功能或改进（提示词 / 模板 / 解析格式 / GUI / 打包 …）
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么不便？想达成什么效果？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你设想的交互/输出是什么样？可以给示例输入输出。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 输入格式 / 解析
        - LLM 富化质量（词义 / 词源 / 例句 …）
        - 提示词（prompts/）
        - 卡片模板 / 样式（templates/）
        - 音频 / TTS
        - GUI
        - CLI
        - 打包 / 发布
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 目前你是怎么解决的？（改提示词、换格式、手动整理 …）
  - type: checkboxes
    id: sanity
    attributes:
      label: 自查
      options:
        - label: 已搜索现有 Issue，无重复提议
